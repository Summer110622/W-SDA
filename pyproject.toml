[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "w-sda"
version = "0.1.0"
description = "Experimental RoPE / Summer Delta Attention / NoPE language models with WAN local training"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "summer"}]
dependencies = [
  "torch>=2.5,<3", "numpy>=1.26,<3", "safetensors>=0.5,<1",
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "nbformat>=5"]
tokenizer = ["tokenizers>=0.20,<1"]

[project.scripts]
wsda = "wsda.cli:main"

[tool.setuptools.packages.find]
include = ["wsda*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
